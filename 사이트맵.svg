      <tspan x="550" dy="0">프로필 이름 · 생년월일(달력) · 양력 / 음력</tspan>
      <tspan x="550" dy="31">음력 월(평달 / 윤달) · 태어난 시간 · 태어난 시간을 몰라요</tspan>
    </text>

    <rect x="330" y="590" width="440" height="74" rx="37" fill="#8294d9" />
    <text x="550" y="636" font-size="22" font-weight="700">프로필 저장하고 분석 보기</text>

