    </text>
    <rect x="1160" y="548" width="220" height="100" rx="14" fill="#f0f2ff" stroke="#8294d9" stroke-width="2" />
    <text x="1270" y="605" font-size="19" font-weight="700">오늘의 카드 결과</text>
    <rect x="1420" y="548" width="260" height="100" rx="14" fill="#f0f2ff" stroke="#8294d9" stroke-width="2" />
    <text x="1550" y="592" font-size="18" font-weight="700">
      <tspan x="1550" dy="0">과거 · 현재 · 미래</tspan>
      <tspan x="1550" dy="25">카드 결과</tspan>
    </text>
