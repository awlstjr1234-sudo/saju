    <rect x="1270" y="270" width="260" height="74" rx="37" fill="#8294d9" />
    <text x="1400" y="316" font-size="26" font-weight="700">타로</text>

    <rect x="80" y="375" width="940" height="175" rx="16" fill="#f0f2ff" stroke="#8294d9" stroke-width="2" />
