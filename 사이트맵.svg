<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title description">
  <title id="title">사주·운세 앱 실제 화면 흐름</title>
  <desc id="description">메인에서 프로필 생성 또는 타로로 이동합니다. 프로필 저장 뒤에는 프로필 선택, 새 프로필, 삭제와 사주·오늘의 운세·지정일 운세 탭이 표시됩니다.</desc>
  <rect x="24" y="24" width="1752" height="1272" fill="#fffaf6" stroke="#211d1a" stroke-width="2" />
  <text x="64" y="82" font-family="sans-serif" font-size="36" font-weight="700" fill="#211d1a">사주 · 오늘의 운세 · 타로</text>
  <text x="66" y="118" font-family="sans-serif" font-size="18" fill="#665e58">현재 웹앱에 표시되는 메뉴와 버튼, 결과 흐름</text>

  <g fill="none" stroke="#211d1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M900 210 V246 H550 V270" />
    <path d="M900 246 H1400 V270" />

    <path d="M550 344 V375" />
    <path d="M550 550 V590" />
