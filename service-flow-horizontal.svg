<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1250" viewBox="0 0 1900 1250" role="img" aria-labelledby="title desc">
<title id="title">사주·운세·타로 웹앱 서비스 흐름도 가로형</title>
<desc id="desc">앱 진입과 서비스 선택 이후 사주, 날짜 운세, 타로 서비스 이용 흐름</desc>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#222"/></marker>
  <style>
    text{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;fill:#111;font-size:17px}
    .box{fill:#dedede;stroke:#222;stroke-width:1.8}
    .decision{fill:#dedede;stroke:#222;stroke-width:1.8}
    .flow{fill:none;stroke:#222;stroke-width:1.8;marker-end:url(#arrow)}
    .plain{fill:none;stroke:#222;stroke-width:1.8}
    .label{font-size:19px;font-weight:700}
    .edge{font-size:14px}
    .start{fill:#fff;stroke:#222;stroke-width:1.8}
  </style>
</defs>
<rect width="1900" height="1250" fill="#fff"/>
<path d="M24 24H1876V1226H24Z" fill="none" stroke="#555" stroke-width="1.5"/>

<ellipse cx="105" cy="625" rx="66" ry="31" class="start"/>
<text x="105" y="631" text-anchor="middle">시작</text>
<path d="M171 625H215" class="flow"/>
<rect x="215" y="594" width="170" height="62" class="box"/>
<text x="300" y="631" text-anchor="middle">앱 메인 화면</text>
<path d="M385 625H420" class="flow"/>
<path d="M500 570L580 625L500 680L420 625Z" class="decision"/>
<text x="500" y="621" text-anchor="middle"><tspan x="500">서비스</tspan><tspan x="500" dy="22">선택</tspan></text>
<path d="M580 625H606V300M606 300V1020" class="plain"/>
<path d="M606 300H650M606 660H650M606 1020H650" class="flow"/>
<text x="612" y="282" class="edge">사주</text>
<text x="612" y="642" class="edge">운세</text>
<text x="612" y="1002" class="edge">타로</text>

<text x="650" y="220" class="label">사주 풀이</text>
<path d="M720 250L790 300L720 350L650 300Z" class="decision"/>
<text x="720" y="306" text-anchor="middle">프로필 있음?</text>
<path d="M790 286H830" class="flow"/>
<text x="797" y="277" class="edge">예</text>
<rect x="830" y="254" width="150" height="64" class="box"/>
<text x="905" y="292" text-anchor="middle">프로필 선택</text>
<path d="M720 350V382H830" class="flow"/>
<text x="730" y="374" class="edge">아니오</text>
<rect x="830" y="350" width="150" height="64" class="box"/>
<text x="905" y="378" text-anchor="middle"><tspan x="905">프로필 생성</tspan><tspan x="905" dy="20">생년월일·시간 입력</tspan></text>
<path d="M980 286H1010V300M980 382H1010V300H1040" class="flow"/>
<rect x="1040" y="268" width="155" height="64" class="box"/>
<text x="1117" y="296" text-anchor="middle"><tspan x="1117">음력 입력이면</tspan><tspan x="1117" dy="20">양력으로 변환</tspan></text>
<path d="M1195 300H1230" class="flow"/>
<rect x="1230" y="268" width="190" height="64" class="box"/>
<text x="1325" y="296" text-anchor="middle"><tspan x="1325">연·월·일·시주 계산</tspan><tspan x="1325" dy="20">오행 개수 분석</tspan></text>
<path d="M1420 300H1460" class="flow"/>
<rect x="1460" y="268" width="170" height="64" class="box"/>
<text x="1545" y="306" text-anchor="middle">사주 결과 표시</text>

<text x="650" y="580" class="label">오늘·지정일 운세</text>
<rect x="650" y="628" width="150" height="64" class="box"/>
<text x="725" y="656" text-anchor="middle"><tspan x="725">프로필 선택</tspan><tspan x="725" dy="20">또는 생성</tspan></text>
<path d="M800 660H830" class="flow"/>
<path d="M900 620L970 660L900 700L830 660Z" class="decision"/>
<text x="900" y="666" text-anchor="middle">오늘?</text>
<path d="M970 646H1010" class="flow"/>
<text x="980" y="637" class="edge">예</text>
<rect x="1010" y="614" width="135" height="64" class="box"/>
<text x="1077" y="652" text-anchor="middle">오늘 날짜 사용</text>
<path d="M900 700V730H1010" class="flow"/>
<text x="910" y="723" class="edge">아니오</text>
<rect x="1010" y="698" width="135" height="64" class="box"/>
<text x="1077" y="736" text-anchor="middle">운세 날짜 선택</text>
<path d="M1145 646H1170V660M1145 730H1170V660H1200" class="flow"/>
<rect x="1200" y="628" width="170" height="64" class="box"/>
<text x="1285" y="656" text-anchor="middle"><tspan x="1285">띠와 날짜의</tspan><tspan x="1285" dy="20">일진 관계 계산</tspan></text>
<path d="M1370 660H1400" class="flow"/>
<rect x="1400" y="628" width="155" height="64" class="box"/>
<text x="1477" y="656" text-anchor="middle"><tspan x="1477">점수·운세 문구</tspan><tspan x="1477" dy="20">행운 정보 구성</tspan></text>
<path d="M1555 660H1585" class="flow"/>
<rect x="1585" y="628" width="170" height="64" class="box"/>
<text x="1670" y="666" text-anchor="middle">운세 결과 표시</text>

<text x="650" y="940" class="label">타로</text>
<path d="M720 970L790 1020L720 1070L650 1020Z" class="decision"/>
<text x="720" y="1015" text-anchor="middle"><tspan x="720">풀이 방식</tspan><tspan x="720" dy="20">선택</tspan></text>
<path d="M790 1006H830" class="flow"/>
<text x="797" y="997" class="edge">1장</text>
<rect x="830" y="975" width="150" height="64" class="box"/>
<text x="905" y="1013" text-anchor="middle">오늘의 카드</text>
<path d="M720 1070V1100H830" class="flow"/>
<text x="730" y="1092" class="edge">3장</text>
<rect x="830" y="1068" width="150" height="64" class="box"/>
<text x="905" y="1096" text-anchor="middle"><tspan x="905">과거·현재·미래</tspan><tspan x="905" dy="20">3장 풀이</tspan></text>
<path d="M980 1007H1010V1020M980 1100H1010V1020H1040" class="flow"/>
<rect x="1040" y="988" width="155" height="64" class="box"/>
<text x="1117" y="1016" text-anchor="middle"><tspan x="1117">카드를 섞어</tspan><tspan x="1117" dy="20">선택지 제시</tspan></text>
<path d="M1195 1020H1230" class="flow"/>
<rect x="1230" y="988" width="155" height="64" class="box"/>
<text x="1307" y="1026" text-anchor="middle">카드 직접 선택</text>
<path d="M1385 1020H1410" class="flow"/>
<path d="M1480 980L1550 1020L1480 1060L1410 1020Z" class="decision"/>
<text x="1480" y="1026" text-anchor="middle">선택 완료?</text>
<path d="M1480 980V955H1307V988" class="flow"/>
<text x="1490" y="970" class="edge">아니오</text>
<path d="M1550 1020H1580" class="flow"/>
<text x="1555" y="1008" class="edge">예</text>
<rect x="1580" y="988" width="155" height="64" class="box"/>
<text x="1657" y="1016" text-anchor="middle"><tspan x="1657">카드별 의미 확인</tspan><tspan x="1657" dy="20">3장일 때 조합 풀이</tspan></text>
<path d="M1735 1020H1760" class="flow"/>
<rect x="1760" y="988" width="120" height="64" class="box"/>
<text x="1820" y="1026" text-anchor="middle">결과 표시</text>

<text x="650" y="1190" class="edge">프로필 정보는 브라우저에 저장 · 사주/운세는 규칙 기반 계산 · 타로는 사용자가 직접 카드 선택</text>
</svg>