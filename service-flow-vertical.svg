<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1580" viewBox="0 0 1200 1580" role="img" aria-labelledby="title desc">
<title id="title">사주·운세·타로 웹앱 서비스 흐름도 세로형</title>
<desc id="desc">앱 진입과 서비스 선택 이후 사주, 날짜 운세, 타로 서비스 이용 흐름</desc>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#222"/></marker>
  <style>
    text{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;fill:#111;font-size:17px}
    .box{fill:#dedede;stroke:#222;stroke-width:1.8}
    .decision{fill:#dedede;stroke:#222;stroke-width:1.8}
    .flow{fill:none;stroke:#222;stroke-width:1.8;marker-end:url(#arrow)}
    .plain{fill:none;stroke:#222;stroke-width:1.8}
    .label{font-size:20px;font-weight:700}
    .edge{font-size:14px}
    .start{fill:#fff;stroke:#222;stroke-width:1.8}
  </style>
</defs>
<rect width="1200" height="1580" fill="#fff"/>
<path d="M24 24H1176V1556H24Z" fill="none" stroke="#555" stroke-width="1.5"/>

<ellipse cx="600" cy="76" rx="75" ry="30" class="start"/>
<text x="600" y="82" text-anchor="middle">시작</text>
<path d="M600 106V140" class="flow"/>
<rect x="485" y="140" width="230" height="64" class="box"/>
<text x="600" y="179" text-anchor="middle">앱 메인 화면</text>
<path d="M600 204V237" class="flow"/>
<path d="M600 237L680 292L600 347L520 292Z" class="decision"/>
<text x="600" y="288" text-anchor="middle"><tspan x="600">서비스</tspan><tspan x="600" dy="22">선택</tspan></text>
<path d="M520 292L200 430M600 347V430M680 292L1000 430" class="plain"/>
<path d="M200 430V475M600 430V475M1000 430V475" class="flow"/>
<text x="310" y="366" class="edge">사주</text>
<text x="613" y="416" class="edge">운세</text>
<text x="870" y="366" class="edge">타로</text>

<text x="60" y="462" class="label">사주 풀이</text>
<rect x="60" y="480" width="280" height="74" class="box"/>
<text x="200" y="524" text-anchor="middle">프로필 선택 또는 생성</text>
<path d="M200 554V605" class="flow"/>
<rect x="60" y="605" width="280" height="74" class="box"/>
<text x="200" y="637" text-anchor="middle"><tspan x="200">생년월일·달력 종류</tspan><tspan x="200" dy="22">태어난 시간 입력</tspan></text>
<path d="M200 679V730" class="flow"/>
<rect x="60" y="730" width="280" height="74" class="box"/>
<text x="200" y="762" text-anchor="middle"><tspan x="200">음력 입력이면</tspan><tspan x="200" dy="22">양력 날짜로 변환</tspan></text>
<path d="M200 804V855" class="flow"/>
<rect x="60" y="855" width="280" height="74" class="box"/>
<text x="200" y="887" text-anchor="middle"><tspan x="200">연·월·일·시주 계산</tspan><tspan x="200" dy="22">오행 개수 분석</tspan></text>
<path d="M200 929V980" class="flow"/>
<rect x="60" y="980" width="280" height="74" class="box"/>
<text x="200" y="1024" text-anchor="middle">사주 결과 표시</text>

<text x="430" y="462" class="label">오늘·지정일 운세</text>
<rect x="460" y="480" width="280" height="74" class="box"/>
<text x="600" y="524" text-anchor="middle">프로필 선택 또는 생성</text>
<path d="M600 554V605" class="flow"/>
<rect x="460" y="605" width="280" height="74" class="box"/>
<text x="600" y="637" text-anchor="middle"><tspan x="600">오늘 날짜 또는</tspan><tspan x="600" dy="22">운세 날짜 선택</tspan></text>
<path d="M600 679V730" class="flow"/>
<rect x="460" y="730" width="280" height="74" class="box"/>
<text x="600" y="762" text-anchor="middle"><tspan x="600">생년월일에서 띠 계산</tspan><tspan x="600" dy="22">선택 날짜의 일진 확인</tspan></text>
<path d="M600 804V855" class="flow"/>
<rect x="460" y="855" width="280" height="74" class="box"/>
<text x="600" y="887" text-anchor="middle"><tspan x="600">띠와 일진 관계 분석</tspan><tspan x="600" dy="22">점수·운세 문구 구성</tspan></text>
<path d="M600 929V980" class="flow"/>
<rect x="460" y="980" width="280" height="74" class="box"/>
<text x="600" y="1024" text-anchor="middle">운세 결과 표시</text>

<text x="860" y="462" class="label">타로</text>
<path d="M1000 480L1120 545L1000 610L880 545Z" class="decision"/>
<text x="1000" y="541" text-anchor="middle"><tspan x="1000">풀이 방식</tspan><tspan x="1000" dy="22">선택</tspan></text>
<path d="M940 578L915 628M1060 578L1085 628" class="flow"/>
<text x="880" y="608" class="edge">1장</text>
<text x="1094" y="608" class="edge">3장</text>
<rect x="835" y="628" width="155" height="68" class="box"/>
<text x="912" y="668" text-anchor="middle">오늘의 카드</text>
<rect x="1010" y="628" width="155" height="68" class="box"/>
<text x="1087" y="656" text-anchor="middle"><tspan x="1087">과거·현재·미래</tspan><tspan x="1087" dy="21">카드 3장</tspan></text>
<path d="M912 696V720H1000M1087 696V720H1000V735" class="flow"/>
<rect x="860" y="735" width="280" height="68" class="box"/>
<text x="1000" y="775" text-anchor="middle">카드를 섞어 선택지 제시</text>
<path d="M1000 803V837" class="flow"/>
<rect x="860" y="837" width="280" height="68" class="box"/>
<text x="1000" y="877" text-anchor="middle">사용자가 카드 직접 선택</text>
<path d="M1000 905V930" class="flow"/>
<path d="M1000 930L1090 985L1000 1040L910 985Z" class="decision"/>
<text x="1000" y="991" text-anchor="middle">선택 완료?</text>
<path d="M910 985H875V871H860" class="flow"/>
<text x="878" y="974" class="edge">아니오</text>
<path d="M1000 1040V1074" class="flow"/>
<text x="1012" y="1065" class="edge">예</text>
<rect x="860" y="1074" width="280" height="68" class="box"/>
<text x="1000" y="1102" text-anchor="middle"><tspan x="1000">카드별 의미 확인</tspan><tspan x="1000" dy="21">3장일 때 조합 풀이</tspan></text>
<path d="M1000 1142V1180" class="flow"/>
<rect x="860" y="1180" width="280" height="68" class="box"/>
<text x="1000" y="1220" text-anchor="middle">타로 결과 표시</text>

<path d="M200 1054V1365H600M600 1054V1365M1000 1248V1365H600V1400" class="plain"/>
<path d="M600 1365V1400" class="flow"/>
<rect x="430" y="1400" width="340" height="72" class="box"/>
<text x="600" y="1444" text-anchor="middle">결과 확인 · 다른 서비스 또는 종료</text>
<text x="600" y="1520" text-anchor="middle" class="edge">프로필은 브라우저에 저장됩니다</text>
</svg>